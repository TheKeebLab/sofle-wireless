# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

CONFIG_ZMK_STUDIO_LOCKING=n

# Deep sleep after 15 min without use (never while on USB power); any key wakes it.
CONFIG_ZMK_SLEEP=y
# Switch-off gesture and wake-up key, see tkl_power.dtsi.
CONFIG_ZMK_PM_SOFT_OFF=y
# The wake-up key's gpio-keys node is only read by the wake-up code: keep Zephyr's
# gpio-keys driver off so it doesn't fight the key matrix for the same pin.
CONFIG_INPUT_GPIO_KEYS=n

# Mouse wheel for the right knob. Changes the Bluetooth HID descriptor: hosts paired
# with an older firmware must forget the keyboard and pair again.
CONFIG_ZMK_POINTING=y

# Room for long fast knob spins: each notch queues a press and a release, and a full
# queue can keep a press and drop its release (a volume or page key left held). A
# bigger queue makes that much rarer, not impossible.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256
